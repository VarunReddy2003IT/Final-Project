<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 0;
        }

        hr {
            margin-top: 10px;
            border: 0;
            border-top: 1px solid #ddd;
        }

        main {
            width: 100%;
            max-width: 500px;
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 2rem;
            color: #333;
        }

        label {
            font-size: 1.1em;
            color: #555;
            margin-bottom: 8px;
            text-align: left;
            display: block;
            margin-top: 15px;
        }

        input[type="text"], input[type="email"], input[type="password"], select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus, input[type="email"]:focus, input[type="password"]:focus, select:focus {
            border-color: #1a73e8;
        }

        input[type="button"] {
            background-color: #1a73e8;
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease;
            margin-bottom: 10px;
        }

        input[type="button"]:hover {
            background-color: #0d5ba6;
        }

        .checkbox-container {
            text-align: left;
            margin-bottom: 20px;
        }

        .checkbox-container label {
            font-size: 1em;
            color: #555;
        }

        .checkbox-container input {
            margin-right: 10px;
        }

        select {
            font-size: 1rem;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .error-message {
            color: red;
            font-size: 1rem;
            margin-bottom: 10px;
        }

    </style>
</head>
<body>
    <header>
        <img style="margin-left:18% ;" src="./images/logo.jpg" width="998" height="100"/>
        <hr/>
    </header>
    
    <main>
        <div class="login-container">
        <form>
            <h1>Signup</h1> <!-- Heading at the top -->
            
            <label for="college_id">Account ID:</label>
            <input type="text" id="accid" name="college_id" placeholder="Enter your college-id" required>

            <label for="Name">Name:</label>
            <input type="text" id="Name" name="name" placeholder="Enter your name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>

            <label for="cpassword">Confirm Password:</label>
            <input type="password" id="cpassword" placeholder="Confirm your password" required>

            <div class="checkbox-container">
                <input type="checkbox" id="show">
                <label for="show">Show Password</label>
            </div>

            <label for="role">Role:</label>
            <select id="role">
                <option value="Admin">Admin</option>
                <option value="Club Head" >Club Head</option>
                <option value="Student" selected>Student</option>
            </select>

            <input type="button" value="Sign Up">
            <input type="button" value="Reset">
        </form>
        </div>
    </main>
    
</body>
</html>
