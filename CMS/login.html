<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 0;
        }

        .login-container {
            background-color: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            margin-left: 34%;
            margin-top: 10%;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        label {
            font-size: 1.1em;
            color: #555;
            margin-bottom: 10px;
            display: block;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
            box-sizing: border-box;
        }

        input[type="submit"] {
            background-color: #1a73e8;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 1.1em;
            cursor: pointer;
            width: 100%;
        }

        input[type="submit"]:hover {
            background-color: #0d5ba6;
        }

        .forgot-password {
            text-align: right;
            font-size: 0.9em;
            color: #1a73e8;
            text-decoration: none;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .error-message {
            color: red;
            text-align: center;
            font-size: 1em;
            margin-bottom: 10px;
        }

    </style>
</head>
<body>
    <header>
        <img style="margin-left:18% ;" src="./images/logo.jpg" width="998" height="100"/>
        <hr/>
    </header>
    <main>
        <div class="login-container">
            <h2>Login</h2>
    
            <div class="error-message" id="error-message"></div>
    
            <form id="login-form" action="#" method="POST">
                <!-- Roll Number / College ID Input -->
                <label for="college-id">Roll No / College ID</label>
                <input type="text" id="college-id" name="college-id" placeholder="Enter your Roll No or College ID" required>
                
                <!-- Password Input -->
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
    
                <!-- Submit Button -->
                <input type="submit" value="Login">
    
                <!-- Forgot Password Link -->
                <a href="#" class="forgot-password" id="forgot-password-link">Forgot Password?</a>
            </form>
        </div>
    
    </main>
</body>
</html>
